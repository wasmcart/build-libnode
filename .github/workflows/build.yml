name: Build libnode

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y python3 g++ make
      - name: Build
        run: ./build.sh
      - name: Package
        run: cd out/linux-x86_64 && tar czf ../../libnode-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-linux-x86_64
          path: libnode-linux-x86_64.tar.gz

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y python3 g++ make
      - name: Build
        run: ./build.sh
      - name: Package
        run: cd out/linux-aarch64 && tar czf ../../libnode-linux-aarch64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-linux-aarch64
          path: libnode-linux-aarch64.tar.gz

  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: ./build.sh
      - name: Package
        run: cd out/macos-x86_64 && tar czf ../../libnode-macos-x86_64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-macos-x86_64
          path: libnode-macos-x86_64.tar.gz

  build-macos-aarch64:
    runs-on: macos-15
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: JOBS=1 ./build.sh
      - name: Package
        run: cd out/macos-aarch64 && tar czf ../../libnode-macos-aarch64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-macos-aarch64
          path: libnode-macos-aarch64.tar.gz

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: choco install python3 nasm -y
      - name: Read version
        id: ver
        shell: bash
        run: echo "node_version=$(cat NODE_VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Clone Node.js
        shell: bash
        run: git clone --depth 1 --branch "v${{ steps.ver.outputs.node_version }}" https://github.com/nodejs/node.git node-src
      - name: Build
        shell: cmd
        run: |
          cd node-src
          rem NO ltcg: with link-time codegen, every .obj (in libs AND on disk) is
          rem LTCG intermediate bitcode, not real COFF — so the napi objects can't
          rem be merged into the fat libnode.lib (lib.exe -> LNK1136). Node 26
          rem seals N-API only inside its own libnode.lib; we must merge the napi
          rem objects in, which requires real COFF objects. Dropping ltcg makes
          rem them mergeable (v24's lib worked because it wasn't blocked here).
          call vcbuild.bat release static no-cctest without-intl nonpm
      - name: Merge libs
        shell: cmd
        run: |
          rem Locate vcvarsall.bat via vswhere instead of hardcoding the VS
          rem year/edition — the GitHub windows runner image moves between VS
          rem versions (e.g. 2022 -> 2026/v18), and a missing hardcoded path
          rem silently no-ops the `call`, leaving lib.exe off PATH ("'lib.exe'
          rem is not recognized"). vswhere lives at a fixed location.
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH echo FATAL: VS install not found via vswhere & exit /b 1
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          where lib.exe >nul 2>&1 || (echo FATAL: lib.exe not on PATH after vcvars & exit /b 1)
          mkdir out\windows-x86_64
          cd node-src\out\Release\lib
          rem Merge ALL component libs into one fat libnode.lib — this matches the
          rem proven v24.14.1 recipe (which merged *.lib wholesale and shipped a
          rem valid ~557MB-zipped asset). A Windows static libnode.lib is genuinely
          rem multi-GB uncompressed (all of V8 + OpenSSL + Node, no member dedup);
          rem the downstream linker drops unused members. Do NOT try to slim it.
          rem
          rem Node 26 emits its OWN libnode.lib here, and it is NOT a duplicate of
          rem the component libs — it ALONE holds the N-API objects
          rem (js_native_api_v8.obj / node_api.obj) and the CRT math import
          rem (log1pf). v24 had these in an obj/libnode group that got merged; v26
          rem only ships them inside libnode.lib. The old recipe EXCLUDED
          rem libnode.lib (to dodge LNK1107 from feeding it as both in+out) -> all
          rem of N-API was dropped -> downstream LNK2001 napi_* / __imp_log1pf.
          rem
          rem lib.exe can't merge a static .lib as a member (LNK1107), and
          rem EXTRACTING members from this LTCG archive yields thin LTCG bitcode,
          rem not real COFF (LNK1136). So use the REAL on-disk object files that
          rem vcbuild wrote under out\Release\obj before archiving — those are the
          rem genuine js_native_api_v8.obj / node_api.obj. Find them on disk and
          rem add them (as objects) to the component-lib merge, like v24 did.
          (for /f "delims=" %%f in ('dir /b *.lib ^| findstr /v /i /c:"libnode.lib"') do @echo %%f) > liblist.txt
          rem Append the REAL on-disk napi objects. cwd is node-src\out\Release\lib;
          rem search the WHOLE out tree (..\.. = out\Release) so we don't depend on
          rem the exact obj subdir layout. dir /s prints full paths.
          del napilist.txt 2>nul
          for /f "delims=" %%o in ('dir /b /s ..\..\Release\obj\js_native_api_v8.obj ..\..\Release\obj\node_api.obj 2^>nul') do (
            echo found napi obj: %%o
            echo %%o>> liblist.txt
            echo %%o>> napilist.txt
          )
          rem Fail loud if the on-disk napi objects were not found at all.
          if not exist napilist.txt (echo FATAL: no on-disk js_native_api_v8.obj/node_api.obj under out\Release\obj — dumping tree for diagnosis & dir /b /s ..\..\Release\obj\*napi*.obj ..\..\Release\obj\*node_api*.obj & exit /b 1)
          type liblist.txt
          lib.exe /OUT:libnode_merged.lib @liblist.txt
          if errorlevel 1 exit /b 1
          rem Guard so the N-API-dropped regression can never ship green again:
          rem the merged lib MUST define napi_create_function. Fail hard if absent.
          dumpbin /symbols libnode_merged.lib | findstr /c:"napi_create_function" >nul
          if errorlevel 1 (echo FATAL: merged libnode.lib has NO napi_create_function — N-API objects missing & exit /b 1)
          echo OK: N-API present in merged libnode.lib
          move /y libnode_merged.lib ..\..\..\..\out\windows-x86_64\libnode.lib
      - name: Collect headers
        shell: bash
        run: |
          mkdir -p out/windows-x86_64/include
          cp -r node-src/src/node.h node-src/src/node_version.h node-src/src/node_api.h node-src/src/node_api_types.h \
                node-src/src/node_buffer.h node-src/src/js_native_api.h node-src/src/js_native_api_types.h \
                out/windows-x86_64/include/ 2>/dev/null || true
          cp -r node-src/deps/v8/include/* out/windows-x86_64/include/ 2>/dev/null || true
          cp -r node-src/deps/uv/include/* out/windows-x86_64/include/ 2>/dev/null || true
          cat NODE_VERSION > out/windows-x86_64/NODE_VERSION
          ls -lh out/windows-x86_64/libnode.lib
          # Stub guard only: a real merged libnode.lib is large (multi-GB
          # uncompressed on Windows — all of V8/OpenSSL/Node, no member dedup;
          # v24.14.1 shipped ~557MB zipped). NO upper bound — a big .lib is
          # correct here; the downstream linker strips unused members.
          SZ=$(stat -c%s out/windows-x86_64/libnode.lib 2>/dev/null || stat -f%z out/windows-x86_64/libnode.lib)
          if [ "$SZ" -lt 50000000 ]; then
            echo "FATAL: libnode.lib is ${SZ} bytes (expected >50MB) — merge produced a stub." >&2
            exit 1
          fi
      - name: Package
        shell: bash
        run: cd out/windows-x86_64 && 7z a ../../libnode-windows-x86_64.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-windows-x86_64
          path: libnode-windows-x86_64.zip

  build-android-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29   # Node 26's V8 needs std::atomic_ref (libc++ 19.1+); r28b ships 19.0, r29 ships a newer clang/libc++
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y python3 g++ make
      - name: Build
        run: ./build-android.sh --ndk ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Package
        run: cd out/android-aarch64 && tar czf ../../libnode-android-aarch64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-android-aarch64
          path: libnode-android-aarch64.tar.gz

  release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-x86_64, build-macos-aarch64, build-windows-x86_64, build-android-aarch64]
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Read version
        id: ver
        run: echo "node_version=$(cat NODE_VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "libnode v${{ steps.ver.outputs.node_version }}"
          body: |
            Pre-built libnode static libraries for wasmcart.

            Built from Node.js v${{ steps.ver.outputs.node_version }} with:
            `--fully-static --without-npm --without-inspector --without-intl`

            Each archive contains `libnode.a` (or `.lib`), headers (Node.js + V8 + libuv), and a NODE_VERSION file.
            Link statically into your binary — no runtime .so/.dll dependency.
          files: |
            artifacts/libnode-linux-x86_64/*.tar.gz
            artifacts/libnode-linux-aarch64/*.tar.gz
            artifacts/libnode-macos-x86_64/*.tar.gz
            artifacts/libnode-macos-aarch64/*.tar.gz
            artifacts/libnode-windows-x86_64/*.zip
            artifacts/libnode-android-aarch64/*.tar.gz
