name: Build libnode

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y python3 g++ make
      - name: Build
        run: ./build.sh
      - name: Package
        run: cd out/linux-x86_64 && tar czf ../../libnode-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-linux-x86_64
          path: libnode-linux-x86_64.tar.gz

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y python3 g++ make
      - name: Build
        run: ./build.sh
      - name: Package
        run: cd out/linux-aarch64 && tar czf ../../libnode-linux-aarch64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-linux-aarch64
          path: libnode-linux-aarch64.tar.gz

  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: ./build.sh
      - name: Package
        run: cd out/macos-x86_64 && tar czf ../../libnode-macos-x86_64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-macos-x86_64
          path: libnode-macos-x86_64.tar.gz

  build-macos-aarch64:
    runs-on: macos-15
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: JOBS=1 ./build.sh
      - name: Package
        run: cd out/macos-aarch64 && tar czf ../../libnode-macos-aarch64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-macos-aarch64
          path: libnode-macos-aarch64.tar.gz

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: choco install python3 nasm -y
      - name: Read version
        id: ver
        shell: bash
        run: echo "node_version=$(cat NODE_VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Clone Node.js
        shell: bash
        run: git clone --depth 1 --branch "v${{ steps.ver.outputs.node_version }}" https://github.com/nodejs/node.git node-src
      - name: Build
        shell: cmd
        run: |
          cd node-src
          rem Match the proven v24.14.1 flags EXACTLY (it built a valid napi lib):
          rem release ltcg static. The Windows fix is in the Merge step (output
          rem collision), not here — keep ltcg.
          call vcbuild.bat release ltcg static no-cctest without-intl nonpm
      - name: Merge libs
        shell: cmd
        run: |
          rem Locate vcvarsall.bat via vswhere instead of hardcoding the VS
          rem year/edition — the GitHub windows runner image moves between VS
          rem versions (e.g. 2022 -> 2026/v18), and a missing hardcoded path
          rem silently no-ops the `call`, leaving lib.exe off PATH ("'lib.exe'
          rem is not recognized"). vswhere lives at a fixed location.
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH echo FATAL: VS install not found via vswhere & exit /b 1
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          where lib.exe >nul 2>&1 || (echo FATAL: lib.exe not on PATH after vcvars & exit /b 1)
          mkdir out\windows-x86_64
          cd node-src\out\Release\lib
          rem ── DIAGNOSTICS (one run to learn the real file natures) ────────────
          rem Several merge strategies failed (LNK1107 feeding a .lib; LNK1136 on
          rem extracted AND on-disk napi objs). Before guessing again, dump WHAT
          rem these files actually are: dumpbin /headers reports COFF vs LTCG/
          rem anonymous-object, and whether libnode.lib carries the napi symbols.
          echo ===== which .lib files are in Release\lib =====
          dir /b *.lib
          echo ===== does the self-emitted libnode.lib define napi_create_function? =====
          dumpbin /symbols libnode.lib 2>nul | findstr /c:"napi_create_function" && echo LIBNODE_HAS_NAPI || echo libnode.lib has NO napi
          echo ===== headers of the on-disk napi obj (COFF vs anon/LTCG?) =====
          for /f "delims=" %%o in ('dir /b /s ..\..\Release\obj\js_native_api_v8.obj 2^>nul') do dumpbin /headers "%%o" | findstr /i /c:"machine" /c:"anonymous" /c:"LTCG" /c:"FILE HEADER"
          rem ── MERGE. Diagnostics proved: (a) the self-emitted libnode.lib does
          rem NOT contain napi AND is unreadable by lib.exe (LNK1107) — so EXCLUDE
          rem it; (b) the napi objects live on disk at out\Release\obj\libnode\src\
          rem as LTCG-thin objects. lib.exe reads LTCG objects ONLY with /LTCG.
          rem So: merge the component *.lib (minus libnode.lib) PLUS the on-disk
          rem napi objects, all under /LTCG. Output to %TEMP% (avoid glob collision).
          (for /f "delims=" %%f in ('dir /b *.lib ^| findstr /v /i /c:"libnode.lib"') do @echo %%f) > liblist.txt
          for /f "delims=" %%o in ('dir /b /s ..\..\Release\obj\js_native_api_v8.obj ..\..\Release\obj\node_api.obj 2^>nul') do @echo %%o>> liblist.txt
          echo ===== merge inputs ===== & type liblist.txt
          lib.exe /LTCG /OUT:%TEMP%\libnode_merged.lib @liblist.txt
          if errorlevel 1 (echo MERGE FAILED — see diagnostics above & exit /b 1)
          rem Guard so the N-API-dropped regression can never ship green again.
          dumpbin /symbols %TEMP%\libnode_merged.lib | findstr /c:"napi_create_function" >nul
          if errorlevel 1 (echo FATAL: merged libnode.lib has NO napi_create_function & exit /b 1)
          echo OK: N-API present in merged libnode.lib
          move /y %TEMP%\libnode_merged.lib ..\..\..\..\out\windows-x86_64\libnode.lib
      - name: Collect headers
        shell: bash
        run: |
          mkdir -p out/windows-x86_64/include
          cp -r node-src/src/node.h node-src/src/node_version.h node-src/src/node_api.h node-src/src/node_api_types.h \
                node-src/src/node_buffer.h node-src/src/js_native_api.h node-src/src/js_native_api_types.h \
                out/windows-x86_64/include/ 2>/dev/null || true
          cp -r node-src/deps/v8/include/* out/windows-x86_64/include/ 2>/dev/null || true
          cp -r node-src/deps/uv/include/* out/windows-x86_64/include/ 2>/dev/null || true
          cat NODE_VERSION > out/windows-x86_64/NODE_VERSION
          ls -lh out/windows-x86_64/libnode.lib
          # Stub guard only: a real merged libnode.lib is large (multi-GB
          # uncompressed on Windows — all of V8/OpenSSL/Node, no member dedup;
          # v24.14.1 shipped ~557MB zipped). NO upper bound — a big .lib is
          # correct here; the downstream linker strips unused members.
          SZ=$(stat -c%s out/windows-x86_64/libnode.lib 2>/dev/null || stat -f%z out/windows-x86_64/libnode.lib)
          if [ "$SZ" -lt 50000000 ]; then
            echo "FATAL: libnode.lib is ${SZ} bytes (expected >50MB) — merge produced a stub." >&2
            exit 1
          fi
      - name: Package
        shell: bash
        run: cd out/windows-x86_64 && 7z a ../../libnode-windows-x86_64.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-windows-x86_64
          path: libnode-windows-x86_64.zip

  build-android-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29   # Node 26's V8 needs std::atomic_ref (libc++ 19.1+); r28b ships 19.0, r29 ships a newer clang/libc++
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y python3 g++ make
      - name: Build
        run: ./build-android.sh --ndk ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Package
        run: cd out/android-aarch64 && tar czf ../../libnode-android-aarch64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: libnode-android-aarch64
          path: libnode-android-aarch64.tar.gz

  release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-x86_64, build-macos-aarch64, build-windows-x86_64, build-android-aarch64]
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Read version
        id: ver
        run: echo "node_version=$(cat NODE_VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "libnode v${{ steps.ver.outputs.node_version }}"
          body: |
            Pre-built libnode static libraries for wasmcart.

            Built from Node.js v${{ steps.ver.outputs.node_version }} with:
            `--fully-static --without-npm --without-inspector --without-intl`

            Each archive contains `libnode.a` (or `.lib`), headers (Node.js + V8 + libuv), and a NODE_VERSION file.
            Link statically into your binary — no runtime .so/.dll dependency.
          files: |
            artifacts/libnode-linux-x86_64/*.tar.gz
            artifacts/libnode-linux-aarch64/*.tar.gz
            artifacts/libnode-macos-x86_64/*.tar.gz
            artifacts/libnode-macos-aarch64/*.tar.gz
            artifacts/libnode-windows-x86_64/*.zip
            artifacts/libnode-android-aarch64/*.tar.gz
